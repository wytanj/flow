<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>flow</title>
<style>
/* ---------------------------------------------------------------------------
   Theme. Colour is carried by one custom property per element, --h (a hue in
   OKLCH), so light and dark each pick their own lightness and chroma from the
   same hue. That is what keeps a shelf recognisably "the same colour" in both
   themes instead of needing two hand-picked palettes.
   --------------------------------------------------------------------------- */
:root {
  --bg: #fbfaf9; --panel: #ffffff; --line: #e3e0dc; --line-soft: #eeebe7;
  --text: #16151a; --dim: #57545e; --faint: #8b8792;
  --accent-h: 258; --accent: oklch(0.52 0.20 var(--accent-h));
  --good: oklch(0.55 0.15 150); --warn: oklch(0.58 0.15 55);
  --chip-l: 0.96; --chip-c: 0.055;      /* chip background */
  --chip-tl: 0.44; --chip-tc: 0.17;     /* chip text */
  --chip-bl: 0.86; --chip-bc: 0.09;     /* chip border */
  --on-accent: #fff;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0b0c; --panel: #141416; --line: #26262b; --line-soft: #1c1c20;
    --text: #ecebf0; --dim: #9a97a3; --faint: #6b6875;
    --accent: oklch(0.74 0.17 var(--accent-h));
    --good: oklch(0.76 0.15 150); --warn: oklch(0.78 0.14 65);
    --chip-l: 0.26; --chip-c: 0.06;
    --chip-tl: 0.80; --chip-tc: 0.15;
    --chip-bl: 0.42; --chip-bc: 0.09;
    --on-accent: #0b0b0c;
  }
}
/* explicit choice always wins over the system preference */
:root[data-theme="light"] {
  --bg: #fbfaf9; --panel: #ffffff; --line: #e3e0dc; --line-soft: #eeebe7;
  --text: #16151a; --dim: #57545e; --faint: #8b8792;
  --accent: oklch(0.52 0.20 var(--accent-h));
  --good: oklch(0.55 0.15 150); --warn: oklch(0.58 0.15 55);
  --chip-l: 0.96; --chip-c: 0.055; --chip-tl: 0.44; --chip-tc: 0.17;
  --chip-bl: 0.86; --chip-bc: 0.09; --on-accent: #fff;
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --panel: #141416; --line: #26262b; --line-soft: #1c1c20;
  --text: #ecebf0; --dim: #9a97a3; --faint: #6b6875;
  --accent: oklch(0.74 0.17 var(--accent-h));
  --good: oklch(0.76 0.15 150); --warn: oklch(0.78 0.14 65);
  --chip-l: 0.26; --chip-c: 0.06; --chip-tl: 0.80; --chip-tc: 0.15;
  --chip-bl: 0.42; --chip-bc: 0.09; --on-accent: #0b0b0c;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--mono);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition: background .15s, color .15s;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 96px; }

/* Long unbroken strings — raw URLs, hashes — must wrap rather than push the
   layout sideways. `anywhere` because `break-word` alone will not split a
   200-character URL with no break opportunities. */
.entry, .detail, #answer, #shelfbar { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }

#gate { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
#gate form { width: 100%; max-width: 380px; }
#gate h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
#gate p { color: var(--dim); margin: 0 0 18px; font-size: 13px; }

input, textarea, button, select { font: inherit; color: inherit; }
input[type=password], input[type=text], textarea {
  width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 13px; outline: none; resize: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea::placeholder, input::placeholder { color: var(--faint); }

button { background: none; border: 1px solid var(--line); border-radius: 8px;
         padding: 7px 13px; color: var(--dim); cursor: pointer;
         transition: color .12s, border-color .12s, background .12s; }
button:hover { color: var(--text); border-color: var(--faint); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
button.on { color: var(--text); border-color: var(--faint); background: var(--line-soft); }
button:disabled { opacity: .5; cursor: default; }

header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
header b { font-weight: 700; letter-spacing: .02em; font-size: 17px; }
header .stats { color: var(--faint); font-size: 12px; flex: 1; min-width: 120px; }
header button { padding: 4px 9px; font-size: 12px; }

.composer textarea { min-height: 84px; font-size: 16px; }
.bar { display: flex; gap: 8px; margin-top: 9px; align-items: center; }
.bar .spacer { flex: 1; }
.modes { display: flex; }
.modes button { border-radius: 0; }
.modes button:first-child { border-radius: 8px 0 0 8px; }
.modes button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.hint { color: var(--faint); font-size: 11px; margin-top: 7px; min-height: 15px; }
.hint.err { color: oklch(0.58 0.19 25); }
@media (prefers-color-scheme: dark) { .hint.err { color: oklch(0.72 0.17 25); } }

#answer { margin: 16px 0; padding: 14px 16px; background: var(--panel);
          border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; }
#answer .a { white-space: pre-wrap; }
#answer .meta { color: var(--faint); font-size: 11px; margin-top: 10px; }
#answer cite { color: var(--accent); font-style: normal; cursor: pointer; font-weight: 600; }

/* --- chips: one hue in, both themes out --------------------------------- */
.chip {
  --h: 265;
  border: 1px solid oklch(var(--chip-bl) var(--chip-bc) var(--h));
  background: oklch(var(--chip-l) var(--chip-c) var(--h));
  color: oklch(var(--chip-tl) var(--chip-tc) var(--h));
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  letter-spacing: .01em; cursor: pointer; white-space: nowrap;
}
.chip:hover { filter: brightness(1.06) saturate(1.15); }
.chip.on {
  background: oklch(var(--chip-tl) var(--chip-tc) var(--h));
  color: var(--panel); border-color: oklch(var(--chip-tl) var(--chip-tc) var(--h));
}
.chip .n { opacity: .6; font-weight: 500; margin-left: 3px; }

nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 12px; }
#shelves { flex-direction: column; align-items: flex-start; gap: 6px; margin: -2px 0 14px; }
.shelfrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.shelfrow .lbl { color: var(--faint); font-size: 11px; text-transform: uppercase;
                 letter-spacing: .08em; margin-right: 2px; }
#search { margin-bottom: 14px; }

#shelfbar { display: none; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 12px 14px; margin-bottom: 14px; background: var(--panel);
            border: 1px solid var(--line); border-left: 3px solid oklch(var(--chip-tl) var(--chip-tc) var(--h, 265));
            border-radius: 10px; }
#shelfbar.on { display: flex; }
#shelfbar .name { font-weight: 700; color: oklch(var(--chip-tl) var(--chip-tc) var(--h, 265)); }
#shelfbar .sub { color: var(--faint); font-size: 12px; flex: 1; min-width: 140px; }
#shelfbar button { font-size: 12px; padding: 5px 11px; }
#shelfbar progress { width: 100%; height: 3px; appearance: none; border: none; background: var(--line); }
#shelfbar progress::-webkit-progress-bar { background: var(--line); }
#shelfbar progress::-webkit-progress-value { background: var(--accent); }

.entry { border-bottom: 1px solid var(--line-soft); padding: 14px 2px; }
.entry:last-child { border-bottom: none; }
.entry .head { display: flex; gap: 9px; align-items: baseline; cursor: pointer; flex-wrap: wrap; }
.entry .title { flex: 1 1 220px; min-width: 0; font-weight: 600; }
.entry .kind {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700;
  padding: 2px 7px; border-radius: 5px; white-space: nowrap;
  background: oklch(var(--chip-l) var(--chip-c) var(--h, 265));
  color: oklch(var(--chip-tl) var(--chip-tc) var(--h, 265));
}
.entry .when { color: var(--faint); font-size: 11px; white-space: nowrap; }
.entry .status { font-size: 11px; color: var(--warn); font-weight: 600; }
.entry .status.done { color: var(--good); }
.entry .body { color: var(--dim); font-size: 13px; margin-top: 6px;
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.entry.open .body { -webkit-line-clamp: unset; white-space: pre-wrap; }
.entry .summary { color: var(--faint); font-size: 12px; margin-top: 5px; font-style: italic;
                  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.entry.open .summary { -webkit-line-clamp: unset; }
.entry .data { color: var(--faint); font-size: 12px; margin-top: 5px; }
.entry .link { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--accent);
               text-decoration: none; max-width: 100%; }
.entry .link:hover { text-decoration: underline; }
.entry .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
.entry .tags .chip { cursor: default; font-size: 11px; padding: 2px 8px; }
.entry .bits { color: var(--faint); font-size: 11px; }
.entry mark { background: none; color: var(--text); font-weight: 700; }
.stale { color: var(--faint); font-size: 11px; }
.stale.never { color: var(--warn); }

.detail { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--line); }
.detail .note { color: var(--dim); font-size: 13px; margin-bottom: 9px; }
.detail .note time { color: var(--faint); }
.detail .note.research { border-left: 2px solid var(--accent); padding-left: 10px; margin-left: -12px; }
.detail .note.research .who { color: var(--accent); font-size: 10px; text-transform: uppercase;
                              letter-spacing: .08em; font-weight: 700; }
.detail .note a { color: var(--accent); }
.detail .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.detail .acts button { font-size: 12px; padding: 4px 9px; }
.detail .noteform { display: flex; gap: 6px; margin-top: 10px; }
.detail .noteform input { flex: 1; min-width: 0; }

.empty { color: var(--faint); padding: 26px 2px; text-align: center; font-size: 13px; }
.spin { color: var(--faint); padding: 20px 2px; font-size: 13px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <form id="gateform">
    <h1>flow</h1>
    <p>Paste your API token. It stays in this browser.</p>
    <input type="password" id="token" placeholder="FLOW_API_TOKEN" autocomplete="current-password" />
    <div class="bar"><span class="spacer"></span><button class="primary" type="submit">unlock</button></div>
    <div class="hint" id="gatehint"></div>
  </form>
</div>

<main id="app" class="wrap" hidden>
  <header>
    <b>flow</b>
    <span class="stats" id="stats"></span>
    <button id="theme" title="light / dark">◐</button>
    <button id="logout">lock</button>
  </header>

  <form class="composer" id="composer">
    <textarea id="input" placeholder="what's on your mind?" autofocus></textarea>
    <div class="bar">
      <div class="modes">
        <button type="button" class="on" data-mode="remember">remember</button>
        <button type="button" data-mode="ask">ask</button>
      </div>
      <span class="spacer"></span>
      <button class="primary" type="submit" id="send">save</button>
    </div>
    <div class="hint" id="hint">⌘/ctrl + enter</div>
  </form>

  <div id="answer" hidden></div>

  <nav id="filters"></nav>
  <nav id="shelves"></nav>
  <div id="shelfbar"></div>
  <input type="text" id="search" placeholder="search everything" />
  <div id="feed"></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const KEY = 'flow.token'

  // --- theme ----------------------------------------------------------------
  const THEME = 'flow.theme'
  const applyTheme = (t) => {
    if (t) document.documentElement.setAttribute('data-theme', t)
    else document.documentElement.removeAttribute('data-theme')
    document.querySelector('meta[name=theme-color]')?.setAttribute(
      'content',
      getComputedStyle(document.body).backgroundColor || '#0b0b0c',
    )
  }
  applyTheme(localStorage.getItem(THEME))
  const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches
  document.addEventListener('DOMContentLoaded', () => {
    $('theme').onclick = () => {
      // cycle from whatever is actually showing, so the first tap always flips
      const current = document.documentElement.getAttribute('data-theme') || (systemDark() ? 'dark' : 'light')
      const next = current === 'dark' ? 'light' : 'dark'
      localStorage.setItem(THEME, next)
      applyTheme(next)
    }
  })

  // --- colour ---------------------------------------------------------------
  /**
   * A stable hue per label. Shelves take their hue from the ROOT segment, so
   * ai/harness and ai/frontier are visibly the same family while still being
   * distinguishable — the hierarchy is legible at a glance rather than needing
   * to be read.
   */
  const GOLDEN = 137.508
  function hueFor(label) {
    const root = String(label).split('/')[0]
    // FNV-1a, then bounded before the golden-angle spin. Spinning the raw
    // 32-bit hash overflows float precision and collapses distinct tags onto
    // the same hue — "ai" and "crypto" both came out 245 that way.
    let h = 2166136261
    for (let i = 0; i < root.length; i++) {
      h ^= root.charCodeAt(i)
      h = Math.imul(h, 16777619)
    }
    return Math.round(((Math.abs(h) % 997) * GOLDEN) % 360)
  }
  /** Depth shifts within the family: children sit a little around the parent. */
  function hueForTag(tag) {
    const parts = String(tag).split('/')
    if (parts.length === 1) return hueFor(tag)
    let spin = 0
    for (const seg of parts.slice(1)) {
      for (let i = 0; i < seg.length; i++) spin = (spin * 17 + seg.charCodeAt(i)) >>> 0
    }
    return (hueFor(parts[0]) + 14 + (spin % 26)) % 360
  }
  // kinds get chosen hues rather than hashed ones — a small fixed set worth designing
  const KIND_HUE = {
    thought: 265, reading: 232, repo: 155, movie: 32, person: 340,
    task: 62, idea: 300, fact: 195, place: 128,
  }
  const kindHue = (k) => KIND_HUE[k] ?? hueFor(k)
  let token = localStorage.getItem(KEY) || ''
  let mode = 'remember'
  let view = 'all'
  let shelf = null
  let aiOn = true
  let researchOn = false
  let catchingUp = false
  let openId = null

  const VIEWS = [
    ['all', 'all'], ['due', 'due'], ['thought', 'thoughts'], ['movie', 'watchlist'],
    ['person', 'people'], ['reading', 'reading'], ['task', 'tasks'], ['idea', 'ideas'],
  ]

  // --- api ------------------------------------------------------------------
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { authorization: 'Bearer ' + token, ...(opts.body ? { 'content-type': 'application/json' } : {}), ...opts.headers },
    })
    if (res.status === 401) { lock(); throw new Error('unauthorized') }
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.error || res.status + ' ' + res.statusText)
    return data
  }

  // --- gate -----------------------------------------------------------------
  function lock() {
    localStorage.removeItem(KEY); token = ''
    $('app').hidden = true; $('gate').hidden = false; $('token').focus()
  }
  async function unlock(t) {
    token = t
    const stats = await api('/stats')            // throws if the token is wrong
    localStorage.setItem(KEY, t)
    $('gate').hidden = true; $('app').hidden = false
    renderStats(stats)
    api('/health').then((h) => {
      aiOn = h.ai
      researchOn = h.research
      if (!aiOn) $('hint').textContent = 'no model configured — saving text as-is'
    }).catch(() => {})
    renderFilters(); load(); $('input').focus()
  }

  $('gateform').onsubmit = async (e) => {
    e.preventDefault()
    const t = $('token').value.trim()
    if (!t) return
    $('gatehint').textContent = 'checking…'
    $('gatehint').className = 'hint'
    try { await unlock(t) }
    catch (err) { $('gatehint').textContent = err.message === 'unauthorized' ? 'that token was rejected' : err.message; $('gatehint').className = 'hint err' }
  }
  $('logout').onclick = lock

  // --- composer -------------------------------------------------------------
  for (const b of document.querySelectorAll('.modes button')) {
    b.onclick = () => {
      mode = b.dataset.mode
      for (const x of document.querySelectorAll('.modes button')) x.classList.toggle('on', x === b)
      $('send').textContent = mode === 'ask' ? 'ask' : 'save'
      $('input').placeholder = mode === 'ask' ? 'ask about anything you have saved…' : "what's on your mind?"
      $('input').focus()
    }
  }

  $('input').onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('composer').requestSubmit() }
  }

  $('composer').onsubmit = async (e) => {
    e.preventDefault()
    const text = $('input').value.trim()
    if (!text) return
    const hint = $('hint')
    hint.className = 'hint'
    $('send').disabled = true
    hint.textContent = mode === 'ask' ? 'thinking…' : 'saving…'
    try {
      if (mode === 'ask') {
        const res = await api('/ask', { method: 'POST', body: JSON.stringify({ question: text }) })
        showAnswer(res)
        hint.textContent = ''
      } else {
        // /jot lets a model split and structure it; /capture is the plain fallback
        const res = aiOn
          ? await api('/jot', { method: 'POST', body: JSON.stringify({ text }) })
          : { entries: [(await api('/capture', { method: 'POST', body: JSON.stringify({ body: text }) })).entry] }
        const n = res.entries.length
        hint.textContent = 'saved ' + (n > 1 ? n + ' entries' : res.entries[0].kind)
        $('input').value = ''
        $('answer').hidden = true
        view = 'all'; renderFilters(); load()
        api('/stats').then(renderStats).catch(() => {})
      }
    } catch (err) {
      hint.textContent = err.message
      hint.className = 'hint err'
    } finally {
      $('send').disabled = false
      $('input').focus()
    }
  }

  function showAnswer(res) {
    const el = $('answer')
    // link [abc12345] citations back to the entries they came from
    const withCites = esc(res.answer).replace(/\[([0-9a-f]{8})\]/g, '<cite data-id="$1">[$1]</cite>')
    el.innerHTML = '<div class="a">' + withCites + '</div>' +
      '<div class="meta">' + (res.sources.length ? res.sources.length + ' entries considered · ' : '') +
      'searched: ' + esc(res.searched.join(', ')) + '</div>'
    el.hidden = false
    for (const c of el.querySelectorAll('cite')) {
      c.onclick = () => { $('search').value = ''; view = 'all'; renderFilters(); load(c.dataset.id) }
    }
  }

  // --- feed -----------------------------------------------------------------
  function renderStats(s) {
    const bits = s.by_kind.slice(0, 4).map((k) => k.kind + ' ' + k.count)
    $('stats').textContent = s.total ? s.total + ' saved · ' + bits.join(' · ') : 'nothing saved yet'
  }

  function renderFilters() {
    $('filters').innerHTML = ''
    for (const [key, label] of VIEWS) {
      const b = document.createElement('button')
      b.textContent = label
      b.className = 'chip' + (view === key && !shelf ? ' on' : '')
      // 'all' and 'due' are not kinds, so they take the neutral accent
      b.style.setProperty('--h', key === 'all' || key === 'due' ? 258 : kindHue(key))
      b.onclick = () => { view = key; shelf = null; $('search').value = ''; renderFilters(); load() }
      $('filters').append(b)
    }
    renderShelves()
  }

  // Shelves are tags, nested with '/'. Top level always shows; the children of
  // whichever branch you are in appear beneath it, so depth never clutters.
  async function renderShelves() {
    const nav = $('shelves')
    let list
    try { list = (await api('/shelves')).shelves } catch { return }
    nav.innerHTML = ''
    if (!list.length) return

    const chip = (s) => {
      const b = document.createElement('button')
      b.innerHTML = esc(s.depth ? s.label : s.tag) + '<span class="n">' + s.count + '</span>'
      b.className = 'chip' + (shelf === s.tag ? ' on' : '')
      b.style.setProperty('--h', hueForTag(s.tag))
      b.title = s.tag + (s.own !== s.count ? ` — ${s.own} directly, ${s.count} including sub-shelves` : '')
      b.onclick = () => {
        shelf = shelf === s.tag ? null : s.tag
        $('search').value = ''
        renderFilters(); load()
      }
      return b
    }

    const row = (labelText, items) => {
      const wrap = document.createElement('div')
      wrap.className = 'shelfrow'
      const lbl = document.createElement('span')
      lbl.className = 'lbl'
      lbl.textContent = labelText
      wrap.append(lbl, ...items.map(chip))
      nav.append(wrap)
    }

    row('shelves', list.filter((s) => s.depth === 0))

    // the branch we are inside: children of the current shelf, or of its parent
    const current = list.find((s) => s.tag === shelf)
    const branch = current ? (list.some((s) => s.parent === current.tag) ? current.tag : current.parent) : null
    if (branch) {
      const kids = list.filter((s) => s.parent === branch)
      if (kids.length) row(branch + '/', kids)
    }
  }

  // --- shelf bar ------------------------------------------------------------
  function ago(ts) {
    if (!ts) return null
    const days = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000)
    if (days <= 0) return 'today'
    if (days === 1) return 'yesterday'
    if (days < 30) return days + 'd ago'
    return Math.floor(days / 30) + 'mo ago'
  }

  function renderShelfBar(entries) {
    const bar = $('shelfbar')
    if (!shelf) { bar.className = ''; bar.innerHTML = ''; return }
    bar.className = 'on'
    bar.style.setProperty('--h', hueForTag(shelf))
    const checked = entries.map((e) => e.last_checked_at).filter(Boolean)
    const oldest = checked.length === entries.length
      ? 'last caught up ' + ago(checked.sort()[0])
      : (entries.length - checked.length) + ' never checked'
    bar.innerHTML =
      '<span class="name">' + esc(shelf) + '</span>' +
      '<span class="sub">' + entries.length + (entries.length === 1 ? ' entry · ' : ' entries · ') + oldest + '</span>' +
      '<button id="catchup"' + (researchOn ? '' : ' disabled title="no research provider configured"') + '>catch me up</button>'
    const btn = bar.querySelector('#catchup')
    if (btn && researchOn) btn.onclick = () => catchUpShelf(entries)
  }

  /**
   * One request per entry. Keeps each call inside a serverless timeout and
   * makes the progress bar mean something instead of spinning over a batch.
   */
  async function catchUpShelf(entries) {
    if (catchingUp) return
    catchingUp = true
    const bar = $('shelfbar')
    const sub = bar.querySelector('.sub')
    const btn = bar.querySelector('#catchup')
    btn.disabled = true
    const bp = document.createElement('progress')
    bp.max = entries.length; bp.value = 0
    bar.append(bp)

    let found = 0
    for (const [i, e] of entries.entries()) {
      sub.textContent = 'checking ' + (e.title || 'entry').slice(0, 40) + '… (' + (i + 1) + '/' + entries.length + ')'
      try {
        const r = await api('/entries/' + e.id + '/catchup', { method: 'POST', body: '{}' })
        if (r.changed) found++
      } catch (err) {
        sub.textContent = err.message
      }
      bp.value = i + 1
    }
    sub.textContent = found ? found + ' updated' : 'nothing new'
    catchingUp = false
    setTimeout(() => load(), 900)
  }

  let searchTimer
  $('search').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => load(), 250) }

  async function load(focusId) {
    const feed = $('feed')
    feed.innerHTML = '<div class="spin">loading…</div>'
    const q = $('search').value.trim()
    try {
      let entries
      if (q) {
        entries = (await api('/search?limit=50&q=' + encodeURIComponent(q))).results
      } else if (shelf) {
        entries = (await api('/entries?limit=50&tags=' + encodeURIComponent(shelf))).entries
      } else if (view === 'due') {
        entries = (await api('/due?within_days=14')).due
      } else if (view === 'movie') {
        entries = (await api('/watchlist?show=all')).entries
      } else if (view === 'all') {
        entries = (await api('/entries?limit=50')).entries
      } else {
        entries = (await api('/entries?limit=50&kind=' + view)).entries
      }
      renderFeed(entries, focusId)
      renderShelfBar(entries)
    } catch (err) {
      feed.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'
    }
  }

  function renderFeed(entries, focusId) {
    const feed = $('feed')
    if (!entries.length) {
      feed.innerHTML = '<div class="empty">' + ($('search').value.trim() ? 'nothing matches' : 'nothing here yet') + '</div>'
      return
    }
    feed.innerHTML = ''
    for (const e of entries) feed.append(entryEl(e))
    if (focusId) {
      const el = feed.querySelector('[data-id^="' + focusId + '"]')
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.querySelector('.head').click() }
    }
  }

  const DONE = ['watched', 'done', 'read', 'dropped', 'abandoned', 'cancelled']

  function entryEl(e) {
    const el = document.createElement('div')
    el.className = 'entry'
    el.dataset.id = e.id

    const bits = []
    if (e.rating != null) bits.push(e.rating + '/10')
    if (e.remind_at) bits.push('⏰ ' + e.remind_at.slice(0, 10))
    const when = (e.occurred_at || e.created_at || '').slice(0, 10)

    // url and summary get their own treatment; the rest is a plain key: value line
    const d = e.data || {}
    const url = typeof d.url === 'string' ? d.url : null
    const summary = typeof d.summary === 'string' ? d.summary : null
    const data = Object.entries(d).filter(([k, v]) => v !== null && v !== '' && k !== 'url' && k !== 'summary')
      .map(([k, v]) => k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : v)).join('  ·  ')

    // search results arrive with **bold** fragments around the matched words
    const bodyHtml = e.snippet
      ? esc(e.snippet.replace(/\s+/g, ' ')).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>')
      : esc(e.body || '')

    el.innerHTML =
      '<div class="head">' +
        '<span class="kind" style="--h:' + kindHue(e.kind) + '">' + esc(e.kind) + '</span>' +
        '<span class="title">' + esc(e.title || '(untitled)') + '</span>' +
        (e.status ? '<span class="status' + (DONE.includes(e.status) ? ' done' : '') + '">' + esc(e.status) + '</span>' : '') +
        // only links can be caught up on, so only they get a staleness pill
        (url && shelf
          ? (e.last_checked_at
              ? '<span class="stale">checked ' + ago(e.last_checked_at) + '</span>'
              : '<span class="stale never">never checked</span>')
          : '') +
        '<span class="when">' + when + '</span>' +
      '</div>' +
      (bodyHtml ? '<div class="body">' + bodyHtml + '</div>' : '') +
      (summary ? '<div class="summary">' + esc(summary) + '</div>' : '') +
      (url ? '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
             esc(url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')) + ' ↗</a>' : '') +
      (data ? '<div class="data">' + esc(data) + '</div>' : '') +
      ((e.tags || []).length || bits.length
        ? '<div class="tags">' +
            (e.tags || [])
              .map((t) => '<span class="chip" style="--h:' + hueForTag(t) + '">' + esc(t) + '</span>')
              .join('') +
            (bits.length ? '<span class="bits">' + esc(bits.join(' · ')) + '</span>' : '') +
          '</div>'
        : '')

    el.querySelector('.head').onclick = () => toggle(el, e)
    return el
  }

  async function toggle(el, e) {
    const existing = el.querySelector('.detail')
    if (existing) { existing.remove(); el.classList.remove('open'); openId = null; return }
    for (const d of document.querySelectorAll('.detail')) { d.remove(); d.closest('.entry')?.classList.remove('open') }
    el.classList.add('open'); openId = e.id

    const detail = document.createElement('div')
    detail.className = 'detail'
    detail.innerHTML = '<div class="spin">…</div>'
    el.append(detail)

    let full
    try { full = await api('/entries/' + e.id) }
    catch (err) { detail.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; return }

    const notes = (full.notes || []).map(noteHtml).join('')
    const links = (full.links || []).map((l) =>
      '<div class="note">' + (l.direction === 'out' ? '→ ' : '← ') + esc(l.rel) + ': ' + esc(l.entry.title || 'untitled') + '</div>').join('')

    const isDone = DONE.includes(full.status)
    const doneLabel = full.kind === 'movie' ? 'watched' : full.kind === 'reading' ? 'read' : 'done'

    detail.innerHTML = notes + links +
      '<form class="noteform"><input type="text" placeholder="add a thought…" /><button type="submit">add</button></form>' +
      '<div class="acts">' +
        (isDone ? '' : '<button data-act="done">mark ' + doneLabel + '</button>') +
        '<button data-act="archive">archive</button>' +
        '<button data-act="delete">delete</button>' +
      '</div>'

    detail.querySelector('.noteform').onsubmit = async (ev) => {
      ev.preventDefault()
      const input = detail.querySelector('input')
      const body = input.value.trim()
      if (!body) return
      input.disabled = true
      try {
        await api('/entries/' + e.id + '/notes', { method: 'POST', body: JSON.stringify({ body }) })
        input.value = ''
        detail.remove(); el.classList.remove('open'); toggle(el, e)
      } catch (err) { alert(err.message) } finally { input.disabled = false }
    }

    for (const b of detail.querySelectorAll('[data-act]')) {
      b.onclick = async () => {
        const act = b.dataset.act
        if (act === 'delete' && !confirm('Delete "' + (full.title || 'this entry') + '" permanently?')) return
        try {
          if (act === 'delete') await api('/entries/' + e.id, { method: 'DELETE' })
          else if (act === 'archive') await api('/entries/' + e.id, { method: 'PATCH', body: JSON.stringify({ archived: true }) })
          else await api('/entries/' + e.id, { method: 'PATCH', body: JSON.stringify({ status: doneLabel }) })
          load()
          api('/stats').then(renderStats).catch(() => {})
        } catch (err) { alert(err.message) }
      }
    }
  }

  /**
   * Your own notes and looked-up ones must never be mistaken for each other —
   * in a year you need to know which thoughts were yours.
   */
  function noteHtml(n) {
    // anything not written by the user is marked and named, whether flow looked
    // it up or another model produced it
    const research = n.source && n.source !== 'me'
    const who = n.source === 'research' ? 'looked up' : n.source
    const body = esc(n.body)
      // citations arrive as [[1]](url)
      .replace(/\[\[(\d+)\]\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">[$1]</a>')
      // and the trailing Sources: line is bare urls
      .replace(/(?<!["'>])(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\n/g, '<br>')
    return (
      '<div class="note' + (research ? ' research' : '') + '">' +
      (research ? '<span class="who">' + esc(who) + '</span> ' : '') +
      '<time>' + n.created_at.slice(0, 10) + '</time> — ' + body +
      '</div>'
    )
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  }

  // --- boot -----------------------------------------------------------------
  if (token) {
    unlock(token).catch(() => lock())
  } else {
    $('token').focus()
  }
})()
</script>
</body>
</html>
